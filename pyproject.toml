[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "img2svg"
version = "0.1.0"
description = "Convert raster images to SVG with object and pattern detection"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Mark LaPointe", email = "mark@cloudbsd.org" },
]
keywords = [
    "svg",
    "image",
    "vector",
    "yolo",
    "opencv",
    "object-detection",
    "vtracer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ultralytics>=8.4,<9",
    "torch>=2.0,<3",
    "opencv-python>=4.10,<5",
    "numpy>=1.26,<3",
    "Pillow>=10.0,<12",
    "vtracer>=0.6.15,<1",
    "supervision>=0.28,<1",
    "lxml>=5.0,<6",
    "typer>=0.12,<1",
    "rich>=13.0,<14",
    "pytest-cov>=5.0.0",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
# The [amd] extra must be installed with PIP_INDEX_URL set to the
# ROCm wheel index; see scripts/install_backend.sh. uv does not
# support per-extra index URLs in pyproject.toml.
nvidia = ["torch>=2.0,<3"]
amd = ["torch>=2.0,<3"]
apple = ["torch>=2.0,<3"]
cpu = ["torch>=2.0,<3"]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.12,<4",
    "pytest-json-report>=1.5,<2",
    "pytest-tap>=3.4,<4",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.0,<10",
    "mkdocstrings[python]>=0.25,<1",
]

[project.scripts]
img2svg = "img2svg.cli:app"

[project.urls]
Homepage = "https://github.com/cloudbsdorg/img2svg"
Repository = "https://github.com/cloudbsdorg/img2svg.git"
Issues = "https://github.com/cloudbsdorg/img2svg/issues"
Documentation = "https://cloudbsdorg.github.io/img2svg/"

[tool.hatch.build.targets.wheel]
packages = ["src/img2svg"]

[tool.hatch.build.targets.wheel.force-include]
"man/img2svg.1" = "img2svg/man/img2svg.1"
"src/img2svg/locale/img2svg.pot" = "img2svg/locale/img2svg.pot"

[tool.hatch.build.targets.sdist]
include = [
    "src/img2svg",
    "tests",
    "man",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    ".sisyphus",
    ".idea",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".coverage",
    "htmlcov",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "ultralytics.*",
    "torch.*",
    "cv2.*",
    "vtracer.*",
    "supervision.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m",
    "not slow",
    "--cov=img2svg",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-report=html",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring real dependencies",
]
